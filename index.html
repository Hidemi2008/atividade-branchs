<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="topo">
            <h1>TaskFlow</h1>
            <button id="btn-tema" aria-label="Alternar tema">🌙</button>
        </header>

        <form id="form-tarefa">
            <input type="text" id="input-tarefa" placeholder="Nova tarefa..." required>
            <button type="submit">Adicionar</button>
        </form>

        <div class="filtros">
            <button class="filtro ativo" data-filtro="todas">Todas</button>
            <button class="filtro" data-filtro="pendentes">Pendentes</button>
            <button class="filtro" data-filtro="concluidas">Concluídas</button>
        </div>

        <ul id="lista-tarefas"></ul>
    </main>


    <script src="script.js"></script>
</body>

</html>
